[project]
name = "dore"
version = "0.1.0"
description = "A local AI that keeps learning from everyday use"
requires-python = ">=3.11"
dependencies = [
    "llama-cpp-python",
    "fastembed",
    "faiss-cpu",
    "numpy",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
dore = "dore.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
