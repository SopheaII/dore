[project]
name = "dore"
version = "0.1.0"
description = "A local AI that keeps learning from everyday use"
requires-python = ">=3.11"
dependencies = [
    "llama-cpp-python",
    "fastembed",
    "faiss-cpu",
    "numpy",
    "mcp>=2.3,<3",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
dore = "dore.cli:main"
dore-web = "dore.web:main"
dore-server = "dore.server:main"
dore-claude = "dore.claude_local:main"
dore-hook = "dore.hookclient:main"
dore-bridge = "dore.bridge:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dore = ["web_page.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
