[project]
name = "dore-memory"
version = "0.1.0"
description = "Local long-term memory for Claude Code and other coding agents, learned from everyday use"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "fastembed",
    "faiss-cpu",
    "numpy",
    # Sentence grammar for what to learn (learn/grammar.py); optional at runtime: without it the word rules run.
    "spacy>=3.8,<3.9",
    "en_core_web_md @ https://github.com/explosion/spacy-models/releases/download/en_core_web_md-3.8.0/en_core_web_md-3.8.0-py3-none-any.whl",
    "mcp>=2.3,<3",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
dore-server = "dore.integrations.server:main"
dore-hook = "dore.integrations.hookclient:main"
dore-bridge = "dore.integrations.bridge:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# src/ is the `dore` package itself (no src/dore/ folder), like a Rust crate's src/.
[tool.setuptools]
package-dir = {"dore" = "src"}
packages = ["dore", "dore.memory", "dore.learn", "dore.integrations", "dore.eval"]

[tool.pytest.ini_options]
testpaths = ["tests"]
